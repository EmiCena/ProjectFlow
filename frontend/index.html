<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectFlow</title>
    <script>
      // Hydrate theme + preset before paint to avoid FOUC - mirrors src/store/theme.ts
      try{
        var presets={default:{light:{background:"248 100% 98%",foreground:"224 76% 25%",border:"214 100% 93%",primary:"221 83% 40%",primaryForeground:"0 0% 100%",secondary:"217 91% 60%",accent:"32 95% 44%",muted:"220 33% 94%",destructive:"0 84% 51%",ring:"221 83% 40%",card:"0 0% 100%",cardForeground:"224 76% 25%"},dark:{background:"224 71% 4%",foreground:"210 20% 98%",border:"215 28% 17%",primary:"217 91% 60%",primaryForeground:"224 76% 25%",secondary:"217 91% 60%",accent:"32 95% 44%",muted:"215 28% 17%",destructive:"0 62% 30%",ring:"217 91% 60%",card:"215 28% 17%",cardForeground:"210 20% 98%"}},trello:{light:{background:"0 0% 98%",foreground:"0 0% 9%",border:"0 0% 89%",primary:"212 100% 45%",primaryForeground:"0 0% 100%",secondary:"212 100% 45%",accent:"35 92% 95%",muted:"0 0% 96%",destructive:"0 84% 60%",ring:"212 100% 45%",card:"0 0% 100%",cardForeground:"0 0% 9%"},dark:{background:"0 0% 12%",foreground:"0 0% 98%",border:"0 0% 20%",primary:"212 100% 60%",primaryForeground:"0 0% 12%",secondary:"212 100% 60%",accent:"35 92% 65%",muted:"0 0% 17%",destructive:"0 72% 51%",ring:"212 100% 60%",card:"0 0% 15%",cardForeground:"0 0% 95%"}},ocean:{light:{background:"180 52% 96%",foreground:"180 84% 12%",border:"173 58% 80%",primary:"173 80% 32%",primaryForeground:"0 0% 100%",secondary:"180 77% 36%",accent:"14 100% 60%",muted:"180 31% 90%",destructive:"0 84% 51%",ring:"173 80% 32%",card:"0 0% 100%",cardForeground:"180 84% 12%"},dark:{background:"180 84% 5%",foreground:"180 20% 98%",border:"180 25% 18%",primary:"173 70% 50%",primaryForeground:"180 84% 5%",secondary:"180 70% 50%",accent:"14 90% 65%",muted:"180 25% 15%",destructive:"0 62% 40%",ring:"173 70% 50%",card:"180 25% 12%",cardForeground:"180 20% 98%"}},forest:{light:{background:"120 20% 97%",foreground:"120 30% 15%",border:"120 20% 85%",primary:"142 76% 36%",primaryForeground:"0 0% 100%",secondary:"142 70% 29%",accent:"38 92% 50%",muted:"120 15% 92%",destructive:"0 84% 51%",ring:"142 76% 36%",card:"0 0% 100%",cardForeground:"120 30% 15%"},dark:{background:"120 20% 4%",foreground:"120 20% 98%",border:"120 15% 18%",primary:"142 65% 45%",primaryForeground:"120 20% 4%",secondary:"142 60% 40%",accent:"38 85% 55%",muted:"120 15% 15%",destructive:"0 62% 35%",ring:"142 65% 45%",card:"120 15% 12%",cardForeground:"120 20% 98%"}},sunset:{light:{background:"30 100% 97%",foreground:"340 30% 15%",border:"30 30% 85%",primary:"340 82% 52%",primaryForeground:"0 0% 100%",secondary:"25 95% 53%",accent:"38 92% 50%",muted:"30 20% 92%",destructive:"0 84% 51%",ring:"340 82% 52%",card:"0 0% 100%",cardForeground:"340 30% 15%"},dark:{background:"340 20% 6%",foreground:"30 20% 98%",border:"340 15% 18%",primary:"340 75% 60%",primaryForeground:"340 20% 6%",secondary:"25 90% 60%",accent:"38 90% 55%",muted:"340 15% 15%",destructive:"0 62% 40%",ring:"340 75% 60%",card:"340 15% 12%",cardForeground:"30 20% 98%"}},midnight:{light:{background:"0 0% 100%",foreground:"222 47% 11%",border:"214 32% 91%",primary:"222 47% 11%",primaryForeground:"0 0% 100%",secondary:"215 16% 47%",accent:"38 92% 50%",muted:"213 27% 84%",destructive:"0 84% 51%",ring:"222 47% 11%",card:"0 0% 100%",cardForeground:"222 47% 11%"},dark:{background:"222 47% 6%",foreground:"210 40% 98%",border:"217 33% 17%",primary:"210 40% 98%",primaryForeground:"222 47% 6%",secondary:"215 20% 65%",accent:"38 90% 55%",muted:"217 33% 17%",destructive:"0 62% 30%",ring:"212 95% 68%",card:"222 47% 8%",cardForeground:"210 40% 98%"}},custom:{light:{background:"0 0% 100%",foreground:"0 0% 9%",border:"0 0% 89%",primary:"221 83% 53%",primaryForeground:"0 0% 100%",secondary:"0 0% 96%",accent:"0 0% 96%",muted:"0 0% 96%",destructive:"0 84% 60%",ring:"221 83% 53%",card:"0 0% 100%",cardForeground:"0 0% 9%"},dark:{background:"0 0% 4%",foreground:"0 0% 93%",border:"0 0% 15%",primary:"221 83% 53%",primaryForeground:"0 0% 100%",secondary:"0 0% 15%",accent:"0 0% 15%",muted:"0 0% 15%",destructive:"0 63% 31%",ring:"221 83% 53%",card:"0 0% 9%",cardForeground:"0 0% 93%"}}};
        var t=localStorage.getItem("theme");var p=localStorage.getItem("preset");
        var theme=t==="dark"||t==="light"?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
        var preset=p&&presets[p]?p:"default";
        var cl=localStorage.getItem("customLight");var cd=localStorage.getItem("customDark");
        var customLight=cl?JSON.parse(cl):presets.custom.light;
        var customDark=cd?JSON.parse(cd):presets.custom.dark;
        var colors=preset==="custom"?(theme==="dark"?customDark:customLight):(theme==="dark"?presets[preset].dark:presets[preset].light);
        var root=document.documentElement;root.classList.toggle("dark",theme==="dark");
        var map={background:"--background",foreground:"--foreground",border:"--border",primary:"--primary",primaryForeground:"--primary-foreground",secondary:"--secondary",accent:"--accent",muted:"--muted",destructive:"--destructive",ring:"--ring",card:"--card",cardForeground:"--card-foreground"};
        Object.keys(map).forEach(function(k){root.style.setProperty(map[k],colors[k])});
        root.style.setProperty("color-scheme",theme);
      }catch(e){}
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
